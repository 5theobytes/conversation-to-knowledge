[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c2k"
version = "0.1.0"
description = "Conversation-to-Knowledge: turn noisy multilingual support conversations into a validated, traceable knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
llm = ["anthropic>=0.40"]
embeddings = ["sentence-transformers>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
